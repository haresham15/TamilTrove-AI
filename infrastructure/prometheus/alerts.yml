groups:
  - name: tamiltrove
    rules:
      - alert: TamilTroveApiDown
        expr: up{job="tamiltrove-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: TamilTrove API is not ready

      - alert: TamilTroveElevatedErrorRate
        expr: |
          sum(rate(tamiltrove_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(tamiltrove_http_requests_total[5m])), 1)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API 5xx rate is above 5 percent

      - alert: TamilTroveSearchLatencyRegression
        expr: histogram_quantile(0.95, sum by (le) (rate(tamiltrove_search_duration_seconds_bucket[10m]))) > 0.75
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Search p95 latency exceeds the 750 ms production target

      - alert: TamilTroveZeroResultSpike
        expr: |
          sum(rate(tamiltrove_search_zero_results_total[15m]))
          /
          clamp_min(sum(rate(tamiltrove_search_requests_total[15m])), 1)
          > 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Search zero-result rate is above 15 percent
