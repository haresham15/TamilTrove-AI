[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv-v2",
  "venv",
  "fix_dataset.py",
  "re_embed.py",
  "test_fix.py",
  "test_wiki.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "PT", "PIE", "RUF"]
ignore = [
  # FastAPI dependency injection intentionally places Depends/Security in defaults.
  "B008",
  # Ruff's formatter intentionally does not wrap long SQL/text literals.
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = [
  "error",
  "ignore:.*'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated.*:DeprecationWarning:fastapi.*",
]
markers = [
  "postgres: requires the isolated TAMILTROVE_TEST_POSTGRES_URL database",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "sentence_transformers"]
ignore_missing_imports = true
