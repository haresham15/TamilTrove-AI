name: V2 quality gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  TAMILTROVE_ENV: test
  TAMILTROVE_ENABLE_TRANSFORMER: "false"
  TAMILTROVE_SECRET_KEY: ci-only-signing-key-with-at-least-32-characters
  NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

jobs:
  backend:
    name: Backend format, types, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: tamiltrove_test
          POSTGRES_USER: tamiltrove
          POSTGRES_PASSWORD: tamiltrove-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tamiltrove -d tamiltrove_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TAMILTROVE_TEST_POSTGRES_URL: postgresql://tamiltrove:tamiltrove-test@127.0.0.1:5432/tamiltrove_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Lint Python
        run: python -m ruff check .

      - name: Type-check Python
        run: python -m mypy app main.py

      - name: Run backend unit and integration tests
        run: python -m pytest tests --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend format, types, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  relevance:
    name: Relevance benchmark and regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate reviewed judgments
        run: python evaluation/scripts/validate_dataset.py

      - name: Test evaluation metrics
        run: python -m unittest discover -s evaluation/tests -v

      - name: Run deterministic relevance benchmark
        run: python evaluation/scripts/evaluate.py --output evaluation/reports/ci.json

      - name: Enforce relevance and latency gates
        run: python evaluation/scripts/release_gate.py evaluation/reports/ci.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relevance-report
          path: evaluation/reports/ci.json
          if-no-files-found: error

  delivery-config:
    name: Delivery configuration and runbook integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: infrastructure/requirements-validation.txt

      - name: Install configuration validator
        run: python -m pip install --disable-pip-version-check -r infrastructure/requirements-validation.txt

      - name: Validate YAML, JSON, workflow pins, Compose, environment, and docs
        run: python infrastructure/scripts/validate_config.py

      - name: Render Compose configuration
        run: docker compose --env-file .env.example -f infrastructure/compose.yml config --quiet

      - name: Check deployment adapter contract
        run: |
          python infrastructure/scripts/deployment_webhook.py \
            --dry-run \
            --action deploy \
            --environment staging \
            --release-id 0123456789abcdef0123456789abcdef01234567 \
            --backend-image ghcr.io/owner/repository/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --frontend-image ghcr.io/owner/repository/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --dataset-version v2-seed-1 \
            --embedding-model sentence-transformers/all-MiniLM-L6-v2 \
            --embedding-model-version 1 \
            --ranking-version v2-local-hybrid-1

  dependency-security:
    name: Dependency, secret, and configuration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0, immutable safe release
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  containers:
    name: Build and scan containers
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: [backend, frontend, relevance, delivery-config]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build immutable test images
        run: |
          docker build --tag tamiltrove-backend:${GITHUB_SHA} backend
          docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 --tag tamiltrove-frontend:${GITHUB_SHA} frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0, immutable safe release
        with:
          image-ref: tamiltrove-backend:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0, immutable safe release
        with:
          image-ref: tamiltrove-frontend:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
